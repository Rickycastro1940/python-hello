<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brasaland Knowledge Assistant</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --card: #f5f5f7;
      --border: #ddd; --accent: #b23a2e; --accent-fg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c; --fg: #f2f2f2; --muted: #a0a0a0; --card: #22252b;
        --border: #333; --accent: #e2574a; --accent-fg: #fff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--fg); display: flex; justify-content: center;
      padding: 2rem 1rem;
    }
    main { width: 100%; max-width: 640px; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.sub { color: var(--muted); margin: 0 0 1.5rem; }
    form { display: flex; gap: .5rem; }
    input {
      flex: 1; padding: .75rem 1rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 1rem;
    }
    button {
      padding: .75rem 1.25rem; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: var(--accent-fg); font-size: 1rem; font-weight: 600;
    }
    button:disabled { opacity: .6; cursor: default; }
    #answer {
      margin-top: 1.5rem; padding: 1.25rem; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px; min-height: 3rem;
      white-space: pre-wrap; line-height: 1.5;
    }
    .muted { color: var(--muted); }
    .error { color: var(--accent); }
    .examples { margin-top: 1rem; font-size: .85rem; color: var(--muted); }
    .examples button {
      background: transparent; color: var(--accent); border: 1px solid var(--border);
      padding: .3rem .6rem; border-radius: 999px; font-size: .8rem; margin: .2rem .2rem 0 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Brasaland Knowledge Assistant</h1>
    <p class="sub">Ask about the loyalty program, allergens, waste protocol or supplier ordering.</p>
    <form id="ask-form">
      <input id="question" type="text" placeholder="e.g. How many points do I need for Gold tier?" autocomplete="off" required />
      <button id="submit-btn" type="submit">Ask</button>
    </form>
    <div class="examples">
      Try:
      <button type="button" data-q="How many points do I need for Gold tier?">Gold tier points</button>
      <button type="button" data-q="Does the BBQ Ribs dish have allergens?">BBQ Ribs allergens</button>
      <button type="button" data-q="When must the weekly supplier order be generated?">Weekly order time</button>
    </div>
    <div id="answer" class="muted">Your answer will appear here.</div>
  </main>

  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const btn = document.getElementById("submit-btn");
    const answerEl = document.getElementById("answer");

    async function ask(question) {
      answerEl.className = "muted";
      answerEl.textContent = "Thinking…";
      btn.disabled = true;
      try {
        const res = await fetch("/knowledge/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error("Request failed (" + res.status + ")");
        const data = await res.json();
        answerEl.className = "";
        answerEl.textContent = data.answer;
      } catch (err) {
        answerEl.className = "error";
        answerEl.textContent = "Something went wrong: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (q) ask(q);
    });
    document.querySelectorAll(".examples button").forEach((b) =>
      b.addEventListener("click", () => {
        input.value = b.dataset.q;
        ask(b.dataset.q);
      })
    );
  </script>
</body>
</html>
