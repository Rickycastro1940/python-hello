name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v
